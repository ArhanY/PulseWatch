version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: pulsewatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pulsewatch
      JWT_SECRET: ${JWT_SECRET:-change_this_super_secret_key_in_production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      DEFAULT_MONITOR_INTERVAL_MS: 60000
      DEFAULT_REQUEST_TIMEOUT_MS: 10000
      WORKER_POOL_SIZE: 4
      SCHEDULER_TICK_MS: 5000
      RETRY_MAX_ATTEMPTS: 3
      RETRY_BASE_DELAY_MS: 1000
      CIRCUIT_FAILURE_THRESHOLD: 5
      CIRCUIT_COOLDOWN_MS: 30000
      METRICS_RETENTION_DAYS: 30
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: pulsewatch-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
